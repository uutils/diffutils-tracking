name: CI

on:
  push:
    branches:
    - main
  workflow_dispatch:
  schedule:
  - cron: "0 2,14 * * *"

jobs:
  gnu:
    name: Process the GNU test results
    permissions:
      contents: write
    uses: uutils/uutils-tracking/.github/workflows/gnu-tracking.yml@main
    with:
      repo: uutils/diffutils
      branch: main
      summary-file: diffutils-gnu-result.json
      full-result-artifact: diffutils-gnu-full-result
      full-result-file: test-results.json
